<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro Kid — Lunar Outpost</title>
    <meta
      name="description"
      content="Explore a lunar outpost, collect real geological samples, research material processing, and stabilize your base on the Moon."
    />
    <meta property="og:title" content="Astro Kid — Lunar Outpost" />
    <meta
      property="og:description"
      content="2D Lunar Exploration & Resource Science Game built with Phaser 3 and Vite."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./favicon-512.png" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon-180.png" />
    <meta name="theme-color" content="#060920" />
    <!-- @demo-meta -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/boot-loader.css" />
    <link rel="stylesheet" href="/demo-shell.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #060920;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        background: #060920;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <!-- pre-loader: shown while the game bundle downloads, removed once the canvas exists -->
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="bl-stars" aria-hidden="true"></div>
      <p class="bl-title">ASTRO <span>KID</span></p>
      <div class="bl-run" aria-hidden="true">
        <div class="bl-astro"></div>
        <div class="bl-bar"><div class="bl-fill"></div><div class="bl-cover"></div></div>
      </div>
      <p class="bl-label">LOADING...</p>
      <p class="bl-tip">TIP: KEEP AN EYE ON YOUR OXYGEN.</p>
    </div>
    <script src="/boot-loader.js"></script>
    <script defer src="/demo-shell.js"></script>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
