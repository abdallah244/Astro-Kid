<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Astro Kid</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#060920" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/errors.css" />
</head>

<body data-tone="yellow">
  <div class="err-stars" aria-hidden="true"></div>

  <header class="err-header">
    <div class="err-wrap">
      <a class="err-brand" href="/" aria-label="Astro Kid, home">
        <img src="/favicon-48.png" alt="" width="44" height="44" />
        <span>ASTRO <i>KID</i></span>
      </a>
    </div>
  </header>

  <main class="err-main">
    <p class="err-chip"><span></span>ERROR 404</p>

    <div class="err-code" role="img" aria-label="404">
      <span aria-hidden="true">4</span>
      <img src="/assets/landing/moon.png" alt="" width="170" height="170" />
      <span aria-hidden="true">4</span>
    </div>

    <div class="err-nova">
      <img src="/assets/landing/nova.png" alt="NOVA, the floating robot guide" width="72" height="94" />
      <div class="err-bubble"><b>NOVA SAYS</b><span>Hmm... I took a wrong turn.</span></div>
    </div>

    <h1 class="err-title">PAGE <em>NOT FOUND</em></h1>
    <p class="err-text">This part of the Moon is not on our map. The link may be broken, or the page may have moved.</p>

    <div class="err-actions">
      <a class="err-btn err-btn--yellow" href="/">BACK TO HOME</a>
      <a class="err-btn err-btn--green" href="/play.html">PLAY DEMO</a>
    </div>
  </main>
</body>

</html>
