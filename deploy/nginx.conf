# Astro Kid — nginx reverse proxy & static site config
# Replace <your-domain> with your real domain before enabling.

# Rate limit for page requests (HTML only; static assets and the API have their own limits).
# limit_req_zone must live in the http{} context: this file is included from there (sites-enabled).
limit_req_zone $binary_remote_addr zone=astro_pages:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name <your-domain> www.<your-domain>;
  return 301 https://<your-domain>$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name <your-domain>;

  ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/astro-kid/dist;
  index index.html;

  # Branded error pages (static files in dist/, they use absolute paths so they work at any URL)
  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;
  error_page 429 /429.html;
  limit_req_status 429;

  location ~ ^/(404|500|429)\.html$ {
    internal;
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Hardened security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self';" always;

  # Long-lived immutable cache for Vite content-hashed JS & CSS bundles
  location ~* "^/assets/.+-[A-Za-z0-9_-]{6,}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Unhashed static game artwork & audio (7-day cache so asset fixes reach players)
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /audio/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Node API (Fastify) on localhost:3000
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Internal-only protected installer files (served only via X-Accel-Redirect from /api/download)
  location /_protected/ {
    internal;
    alias /var/www/astro-kid/releases/;
    add_header Content-Disposition 'attachment; filename="AstroKid-Setup.exe"' always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The Phaser game page needs a looser CSP than the marketing pages:
  # an inline <style> in play.html, and blob: URLs that Phaser creates for textures/audio.
  # (add_header in a location replaces the inherited ones, so every header is repeated here.)
  location = /play.html {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
  }

  # Static multi-page Vite output
  location / {
    limit_req zone=astro_pages burst=30 nodelay;
    try_files $uri $uri/ =404;
  }
}
