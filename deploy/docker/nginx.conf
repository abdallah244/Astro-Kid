# nginx inside the "web" container. Plain HTTP on :8080.
# HTTPS is terminated by the reverse proxy that already runs on the VPS (see deploy/DOCKER.md),
# which forwards to 127.0.0.1:${WEB_PORT}.

limit_req_zone $binary_remote_addr zone=astro_pages:10m rate=10r/s;

# Keep the scheme the outer proxy saw (https), so the API sets Secure cookies and builds https redirects.
map $http_x_forwarded_proto $astro_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Real client IP from the outer proxy (Docker networks and localhost only)
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;
  error_page 429 /429.html;
  limit_req_status 429;

  location ~ ^/(404|500|429)\.html$ {
    internal;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self';" always;

  location ~* "^/assets/.+-[A-Za-z0-9_-]{6,}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /audio/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $astro_proto;
    client_max_body_size 64k;
  }

  # Installer files, served only through X-Accel-Redirect from /api/download (signed-in users with a profile)
  location /_protected/ {
    internal;
    alias /releases/;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The game page needs a looser CSP (inline <style>, blob: textures and audio from Phaser).
  location = /play.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
  }

  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location / {
    limit_req zone=astro_pages burst=30 nodelay;
    try_files $uri $uri/ =404;
  }
}
