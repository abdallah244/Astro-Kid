<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Error 429</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
.notch{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
a.btn:hover{filter:brightness(1.15)}
a.btn:active{transform:translateY(3px)}
a:focus-visible{outline:4px solid #ffd23f;outline-offset:4px}
</style>
</helmet>
<div style="position:relative;width:100%;min-height:760px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;background:#060920;font-family:'Chakra Petch',sans-serif">

  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
    <div style="position:absolute;left:5%;top:24%;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:15%;top:70%;width:8px;height:8px;background:#a4aed9"></div>
    <div style="position:absolute;left:26%;top:40%;width:4px;height:4px;background:#5ad1ff"></div>
    <div style="position:absolute;left:35%;top:86%;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:48%;top:12%;width:8px;height:8px;background:#a4aed9"></div>
    <div style="position:absolute;left:62%;top:76%;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:75%;top:32%;width:4px;height:4px;background:#5ad1ff"></div>
    <div style="position:absolute;left:86%;top:62%;width:8px;height:8px;background:#a4aed9"></div>
    <div style="position:absolute;left:94%;top:18%;width:4px;height:4px;background:#ffffff"></div>
  </div>

  <header style="position:relative;z-index:2;box-sizing:border-box;padding:18px 16px;background:#060920;border-bottom:4px solid #3a4a94;box-shadow:0 4px 0 0 #172052">
    <div style="max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <a href="#home" aria-label="Astro Kid, home" style="display:inline-flex;align-items:center;gap:14px;text-decoration:none">
        <img src="/favicon-48.png" alt="" width="44" height="44" style="width:44px;height:44px;image-rendering:pixelated;display:block">
        <span style="font-family:'Press Start 2P',monospace;font-size:16px;line-height:1;color:#ffffff;text-shadow:3px 3px 0 #243372;white-space:nowrap">ASTRO <span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c">KID</span></span>
      </a>
    </div>
  </header>

  <main style="position:relative;z-index:1;flex:1;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px 72px">

    <div class="notch" style="display:inline-flex;align-items:center;gap:10px;height:32px;box-sizing:border-box;padding:0 16px;background:#141c4d;box-shadow:inset -4px -4px 0 0 #0d1236,inset 4px 4px 0 0 #3a4a94;font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:2px;color:#5ad1ff">
      <span aria-hidden="true" style="width:8px;height:8px;background:#5ad1ff"></span>ERROR 429
    </div>

    <div role="img" aria-label="429" style="display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,28px);margin-top:28px">
      <span aria-hidden="true" style="font-family:'Press Start 2P',monospace;font-size:clamp(72px,18vw,168px);line-height:1;color:#5ad1ff;text-shadow:6px 6px 0 #1d5f80,12px 12px 0 #0d2d3d">4</span>
      <!-- pixel hourglass standing in for the "2" -->
      <svg aria-hidden="true" viewBox="0 0 12 12" shape-rendering="crispEdges" style="display:block;width:clamp(68px,16vw,150px);height:clamp(68px,16vw,150px)"><path fill="#5ad1ff" d="M2 0h8v1h-8zM2 1h8v1h-8zM3 2h6v1h-6zM4 3h4v1h-4zM5 4h2v1h-2zM5 5h2v1h-2zM4 6h4v1h-4zM3 7h6v1h-6zM2 10h8v1h-8z"/><path fill="#e9ddff" d="M2 8h8v1h-8zM2 9h8v1h-8z"/></svg>
      <span aria-hidden="true" style="font-family:'Press Start 2P',monospace;font-size:clamp(72px,18vw,168px);line-height:1;color:#5ad1ff;text-shadow:6px 6px 0 #1d5f80,12px 12px 0 #0d2d3d">9</span>
    </div>

    <div style="display:flex;align-items:center;gap:22px;margin-top:34px;max-width:100%">
      <img src="/assets/landing/nova.png" alt="NOVA, the floating robot guide" width="72" height="94" style="flex:none;display:block;width:72px;height:94px;image-rendering:pixelated">
      <div style="position:relative;box-sizing:border-box;padding:14px 22px;text-align:left;background:#141c4d;box-shadow:inset -4px -4px 0 0 #0d1236,inset 4px 4px 0 0 #3a4a94">
        <div aria-hidden="true" style="position:absolute;left:-4px;top:30px;width:4px;height:4px;background:#3a4a94"></div>
        <div aria-hidden="true" style="position:absolute;left:-8px;top:34px;width:8px;height:4px;background:#3a4a94"></div>
        <div aria-hidden="true" style="position:absolute;left:-12px;top:38px;width:12px;height:4px;background:#3a4a94"></div>
        <div aria-hidden="true" style="position:absolute;left:-8px;top:42px;width:8px;height:4px;background:#3a4a94"></div>
        <div aria-hidden="true" style="position:absolute;left:-4px;top:46px;width:4px;height:4px;background:#3a4a94"></div>
        <div style="margin-bottom:4px;font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#5ad1ff">NOVA SAYS</div>
        <div style="font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:18px;line-height:1.4;color:#e4e8ff">Whoa, too fast!</div>
      </div>
    </div>

    <h1 style="margin:34px 0 0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(16px,3.4vw,28px);line-height:1.6;color:#ffffff;text-shadow:3px 3px 0 #243372">SLOW DOWN, <span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c">COMMANDER</span></h1>

    <p style="margin:18px 0 0;max-width:520px;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:19px;line-height:1.6;color:#a4aed9">You sent too many requests in a short time. Wait about a minute, then try again.</p>

    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:34px">
      <a class="btn notch" href="#home" style="display:inline-flex;align-items:center;gap:12px;height:60px;box-sizing:border-box;padding:0 30px;font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:1px;text-decoration:none;color:#1a1a2e;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 7 7" shape-rendering="crispEdges" style="display:block"><path fill="#1a1a2e" d="M0 2h1v3H0zM1 1h1v5H1zM2 3h5v1H2zM2 2h1v3H2z"/></svg>
        BACK TO HOME
      </a>
      <span aria-disabled="true" class="notch" style="display:inline-flex;align-items:center;height:60px;box-sizing:border-box;padding:0 30px;font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:1px;color:#a4aed9;background:#3a4a94;box-shadow:inset -4px -4px 0 0 #243372,inset 4px 4px 0 0 #4a5cb0;cursor:not-allowed">TRY AGAIN IN 60S</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
