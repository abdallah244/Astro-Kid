<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Name Modal Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
.notch{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
button.cbtn:not([disabled]):hover{filter:brightness(1.12)}
button.cbtn:not([disabled]):active{transform:translateY(3px)}
button.xbtn:hover{filter:brightness(1.25)}
input.nm{outline:none}
input.nm:focus{box-shadow:0 0 0 3px #ffd23f,inset 3px 3px 0 0 #060920 !important}
input.nm::placeholder{color:#6c77ad}
button:focus-visible{outline:4px solid #ffd23f;outline-offset:4px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:760px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <img src="/assets/backgrounds/lunar_base_expanded.png" alt="" width="1280" height="760" style="position:absolute;left:0;top:0;width:1280px;height:760px;object-fit:cover;image-rendering:pixelated">
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(6,9,32,0.82)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="name-title" style="position:absolute;left:380px;top:40px;width:520px;box-sizing:border-box;padding:46px 40px 40px;background:#141c4d;box-shadow:0 -4px 0 0 #3a4a94,0 4px 0 0 #3a4a94,-4px 0 0 0 #3a4a94,4px 0 0 0 #3a4a94,14px 14px 0 0 rgba(0,0,0,0.55)">

    <div class="notch" style="position:absolute;left:16px;top:20px;display:inline-flex;align-items:center;gap:8px;height:30px;box-sizing:border-box;padding:0 12px;background:#0d1236;box-shadow:inset -3px -3px 0 0 #060920,inset 3px 3px 0 0 #1c2766;font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;letter-spacing:2px;color:#ffd23f">STEP 2 OF 2</div>

    <button class="xbtn notch" type="button" aria-label="Close" style="position:absolute;right:16px;top:16px;width:40px;height:40px;padding:0;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#243372;box-shadow:inset -4px -4px 0 0 #172052,inset 4px 4px 0 0 #3a4a94">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 5 5" shape-rendering="crispEdges" style="display:block"><path fill="#eef1ff" d="M0 0h1v1H0zM4 0h1v1H4zM1 1h1v1H1zM3 1h1v1H3zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3zM0 4h1v1H0zM4 4h1v1H4z"/></svg>
    </button>

    <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
      <img src="/assets/landing/nova.png" alt="" width="50" height="65" style="display:block;width:50px;height:65px;image-rendering:pixelated">

      <h2 id="name-title" style="margin:14px 0 0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:20px;line-height:1.5;color:#ffffff;text-shadow:3px 3px 0 #243372">ADD YOUR<br><span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c">FULL NAME</span></h2>

      <p style="margin:14px 0 0;max-width:400px;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:17px;line-height:1.55;color:#a4aed9">Enter your three names. It lets you sign in to the game quickly once you download it.</p>
    </div>

    <!-- who is signed in -->
    <div class="notch" style="display:flex;align-items:center;gap:14px;margin-top:24px;box-sizing:border-box;padding:12px 16px;background:#0d1236;box-shadow:inset -4px -4px 0 0 #060920,inset 4px 4px 0 0 #1c2766">
      <div aria-hidden="true" style="flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#ffffff">
        <svg width="20" height="20" viewBox="0 0 18 18" style="display:block"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      </div>
      <div style="min-width:0">
        <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;letter-spacing:1px;color:#3fbf5f">SIGNED IN WITH GOOGLE</div>
        <div style="margin-top:2px;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:16px;color:#ffffff">name@gmail.com</div>
      </div>
    </div>

    <!-- full name (required, 3 names) -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px">
      <label for="fullname" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:1px;color:#ffd23f">FULL NAME (3 NAMES)</label>
      <span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;background:#ff9b54;font-family:'Silkscreen',monospace;font-weight:700;font-size:10px;letter-spacing:1px;color:#1a1a2e">REQUIRED</span>
    </div>
    <input class="nm" id="fullname" type="text" value="{{name}}" onInput="{{onName}}" placeholder="e.g. Ahmed Mohamed Ali" autocomplete="name" style="display:block;width:100%;height:56px;box-sizing:border-box;margin-top:10px;padding:0 16px;border:0;background:#0d1236;box-shadow:0 0 0 3px #3a4a94,inset 3px 3px 0 0 #060920;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:18px;color:#ffffff">

    <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
      <div aria-hidden="true" style="display:flex;gap:6px">
        <span style="width:24px;height:12px;background:{{pip1}}"></span>
        <span style="width:24px;height:12px;background:{{pip2}}"></span>
        <span style="width:24px;height:12px;background:{{pip3}}"></span>
      </div>
      <span role="status" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:1px;color:{{hintColor}}">{{hint}}</span>
    </div>

    <div style="margin-top:24px">
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
        <button class="cbtn notch" type="button" style="display:flex;align-items:center;justify-content:center;width:100%;height:60px;padding:0;border:0;cursor:pointer;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0;font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:1px;color:#1a1a2e">CONTINUE</button>
      </sc-if>
      <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
        <button class="cbtn notch" type="button" disabled aria-disabled="true" style="display:flex;align-items:center;justify-content:center;width:100%;height:60px;padding:0;border:0;cursor:not-allowed;background:#3a4a94;box-shadow:inset -4px -4px 0 0 #243372,inset 4px 4px 0 0 #4a5cb0;font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:1px;color:#a4aed9">CONTINUE</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  state = { name: '' };
  renderVals() {
    const words = this.state.name.trim().split(/\s+/).filter((w) => w.length >= 2);
    const n = Math.min(3, words.length);
    const ready = words.length >= 3;
    return {
      name: this.state.name,
      onName: (e) => this.setState({ name: e.target.value }),
      pip1: n > 0 ? '#3fbf5f' : '#243372',
      pip2: n > 1 ? '#3fbf5f' : '#243372',
      pip3: n > 2 ? '#3fbf5f' : '#243372',
      hint: ready ? 'LOOKS GOOD' : n + ' OF 3 NAMES',
      hintColor: ready ? '#3fbf5f' : '#a4aed9',
      ready,
      notReady: !ready,
    };
  }
}
</script>
</body>
</html>
