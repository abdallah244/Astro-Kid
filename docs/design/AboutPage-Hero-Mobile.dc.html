<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>About Page Hero Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
.notch{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
a.btn:hover,button.btn:hover{filter:brightness(1.12)}
a.btn:active,button.btn:active{transform:translateY(3px)}
a:focus-visible,button:focus-visible{outline:4px solid #ffd23f;outline-offset:4px}
</style>
</helmet>
<div style="position:relative;width:390px;height:940px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <header style="position:absolute;left:0;top:0;width:390px;z-index:5;height:72px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#060920;border-bottom:4px solid #3a4a94;box-shadow:0 4px 0 0 #172052">
    <a href="#top" aria-label="Astro Kid, home" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <img src="/favicon-48.png" alt="" width="40" height="40" style="width:40px;height:40px;image-rendering:pixelated;display:block">
      <span style="font-family:'Press Start 2P',monospace;font-size:14px;line-height:1;color:#ffffff;text-shadow:2px 2px 0 #243372;white-space:nowrap">ASTRO <span style="color:#ffd23f;text-shadow:2px 2px 0 #c2410c">KID</span></span>
    </a>
    <button class="btn notch" type="button" aria-label="Menu" aria-expanded="false" style="width:48px;height:48px;padding:0;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#243372;box-shadow:inset -4px -4px 0 0 #172052,inset 4px 4px 0 0 #3a4a94">
      <div aria-hidden="true" style="display:flex;flex-direction:column;gap:4px">
        <div style="width:20px;height:4px;background:#eef1ff"></div>
        <div style="width:20px;height:4px;background:#eef1ff"></div>
        <div style="width:20px;height:4px;background:#eef1ff"></div>
      </div>
    </button>
  </header>

  <section aria-labelledby="about-hero-title-m" style="position:absolute;left:0;top:76px;width:390px;height:864px;overflow:hidden">

    <!-- picture banner on top, copy below on the plain page colour -->
    <img src="/assets/landing/about_hero.webp" alt="A lunar lander touching down on the Moon, with Earth in the sky and the outpost in the distance" width="390" height="300" style="position:absolute;left:0;top:0;width:390px;height:300px;object-fit:cover;object-position:52% 58%;image-rendering:pixelated">
    <div aria-hidden="true" style="position:absolute;left:0;top:0;width:390px;height:300px;background:rgba(6,9,32,0.22)"></div>
    <div aria-hidden="true" style="position:absolute;left:0;top:228px;width:390px;height:72px">
      <div style="position:absolute;left:0;top:0;width:390px;height:16px;background:rgba(6,9,32,0.2)"></div>
      <div style="position:absolute;left:0;top:16px;width:390px;height:16px;background:rgba(6,9,32,0.45)"></div>
      <div style="position:absolute;left:0;top:32px;width:390px;height:16px;background:rgba(6,9,32,0.72)"></div>
      <div style="position:absolute;left:0;top:48px;width:390px;height:24px;background:#060920"></div>
    </div>

    <div style="position:absolute;left:20px;top:292px;width:350px;display:flex;flex-direction:column;align-items:flex-start">

      <div class="notch" style="display:inline-flex;align-items:center;gap:10px;height:32px;box-sizing:border-box;padding:0 14px;background:#141c4d;box-shadow:inset -4px -4px 0 0 #0d1236,inset 4px 4px 0 0 #3a4a94;font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#ffd23f">
        <span aria-hidden="true" style="width:8px;height:8px;background:#ffd23f"></span>ABOUT ASTRO KID
      </div>

      <h1 id="about-hero-title-m" style="margin:20px 0 0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:28px;line-height:1.4;color:#ffffff;text-shadow:3px 3px 0 #243372,6px 6px 0 #172052">THE STORY<br>BEHIND<br><span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c,6px 6px 0 #7a2a0a">ASTRO KID</span></h1>

      <p style="margin:22px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:16px;line-height:1.6;color:#e4e8ff">Astro Kid puts a child in the boots of a young astronaut at a half-built outpost on the Moon. Every choice costs something, and every mission leaves you understanding one real constraint of deep space survival.</p>

      <div style="display:flex;flex-direction:column;gap:14px;width:350px;margin-top:26px">
        <a class="btn notch" href="#demo" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;color:#0d2a14;background:#3fbf5f;box-shadow:inset -4px -4px 0 0 #1d7a36,inset 4px 4px 0 0 #8be8a2">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" style="display:block"><path fill="#0d2a14" d="M0 0h2v6H0zM2 1h2v4H2zM4 2h2v2H4z"/></svg>
          PLAY FREE DEMO
        </a>
        <a class="btn notch" href="#crew" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;color:#ffffff;background:#243372;box-shadow:inset -4px -4px 0 0 #172052,inset 4px 4px 0 0 #3a4a94">
          MEET THE CREW
          <svg aria-hidden="true" width="14" height="10" viewBox="0 0 5 3" shape-rendering="crispEdges" style="display:block"><path fill="#ffd23f" d="M0 0h5v1H0zM1 1h3v1H1zM2 2h1v1H2z"/></svg>
        </a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
