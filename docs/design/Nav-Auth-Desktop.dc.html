<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navbar Signed In Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
.notch{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
a.navlink{color:#a4aed9}
a.navlink:hover{color:#ffd23f}
a.btn:hover,button.btn:hover{filter:brightness(1.12)}
a.btn:active,button.btn:active{transform:translateY(3px)}
a:focus-visible,button:focus-visible{outline:4px solid #ffd23f;outline-offset:4px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:600px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <div aria-hidden="true" style="position:absolute;inset:0">
    <div style="position:absolute;left:96px;top:540px;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:212px;top:430px;width:8px;height:8px;background:#a4aed9"></div>
    <div style="position:absolute;left:388px;top:500px;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:520px;top:300px;width:4px;height:4px;background:#ffd23f"></div>
    <div style="position:absolute;left:664px;top:560px;width:8px;height:8px;background:#ffffff"></div>
    <div style="position:absolute;left:756px;top:190px;width:4px;height:4px;background:#a4aed9"></div>
  </div>

  <header style="position:relative;z-index:3;height:88px;box-sizing:border-box;background:#060920;border-bottom:4px solid #3a4a94;box-shadow:0 4px 0 0 #172052;display:flex;align-items:center;justify-content:center">
    <div style="width:1120px;display:flex;align-items:center;justify-content:space-between;gap:24px">

      <a href="#top" aria-label="Astro Kid, home" style="display:flex;align-items:center;gap:16px;text-decoration:none">
        <img src="/favicon-48.png" alt="" width="48" height="48" style="width:48px;height:48px;image-rendering:pixelated;display:block">
        <span style="font-family:'Press Start 2P',monospace;font-size:18px;line-height:1;color:#ffffff;text-shadow:3px 3px 0 #243372;white-space:nowrap">ASTRO <span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c">KID</span></span>
      </a>

      <nav aria-label="Primary" style="display:flex;align-items:center;gap:30px">
        <a class="navlink" href="#learn" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;padding:12px 0">LEARN</a>
        <a class="navlink" href="#missions" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;padding:12px 0">MISSIONS</a>
        <a class="navlink" href="#install" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;padding:12px 0">INSTALL</a>

        <span aria-hidden="true" style="width:4px;height:32px;background:#243372"></span>

        <a class="btn notch" href="#demo" style="display:inline-flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;padding:0 20px;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;color:#0d2a14;background:#3fbf5f;box-shadow:inset -4px -4px 0 0 #1d7a36,inset 4px 4px 0 0 #8be8a2">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" style="display:block"><path fill="#0d2a14" d="M0 0h2v6H0zM2 1h2v4H2zM4 2h2v2H4z"/></svg>
          PLAY DEMO
        </a>
        <a class="btn notch" href="#download" style="display:inline-flex;align-items:center;height:48px;box-sizing:border-box;padding:0 20px;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;color:#1a1a2e;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0">DOWNLOAD</a>

        <!-- account chip -->
        <button class="btn notch" type="button" aria-haspopup="true" aria-expanded="{{open}}" aria-label="Account menu" onClick="{{toggle}}" style="display:inline-flex;align-items:center;gap:12px;height:52px;box-sizing:border-box;padding:0 16px 0 6px;border:0;cursor:pointer;background:#141c4d;box-shadow:inset -4px -4px 0 0 #0d1236,inset 4px 4px 0 0 #3a4a94;font-family:'Silkscreen',monospace;font-weight:700;font-size:14px;letter-spacing:1px;color:#ffffff">
          <img src="/assets/ui/avatar_face.png" alt="" width="38" height="38" style="display:block;width:38px;height:38px;object-fit:cover;background:#0d1236">
          AHMED
          <svg aria-hidden="true" width="12" height="8" viewBox="0 0 5 3" shape-rendering="crispEdges" style="display:block"><path fill="#ffd23f" d="M0 0h5v1H0zM1 1h3v1H1zM2 2h1v1H2z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- account menu: read-only details + delete -->
  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div role="dialog" aria-label="Your account" style="position:absolute;z-index:4;left:820px;top:100px;width:380px;box-sizing:border-box;padding:24px;background:#141c4d;box-shadow:0 -4px 0 0 #3a4a94,0 4px 0 0 #3a4a94,-4px 0 0 0 #3a4a94,4px 0 0 0 #3a4a94,12px 12px 0 0 rgba(0,0,0,0.55)">

      <div style="display:flex;align-items:center;gap:16px">
        <img src="/assets/ui/avatar_face.png" alt="" width="64" height="64" style="flex:none;display:block;width:64px;height:64px;object-fit:cover;background:#0d1236;box-shadow:0 0 0 4px #3a4a94">
        <div style="min-width:0">
          <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#ffd23f">YOUR ACCOUNT</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
            <span aria-hidden="true" style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:#ffffff">
              <svg width="12" height="12" viewBox="0 0 18 18" style="display:block"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
            </span>
            <span style="font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;letter-spacing:1px;color:#3fbf5f">SIGNED IN WITH GOOGLE</span>
          </div>
        </div>
      </div>

      <div style="margin-top:22px">
        <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;letter-spacing:1px;color:#8e9ad0">FULL NAME</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;box-sizing:border-box;margin-top:6px;padding:0 14px;background:#0d1236;box-shadow:inset 3px 3px 0 0 #060920,inset -3px -3px 0 0 #1c2766">
          <span style="font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:17px;color:#ffffff">Ahmed Mohamed Ali</span>
          <svg role="img" aria-label="Locked" width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" style="flex:none;display:block"><path fill="#a4aed9" d="M2 0h4v1H2zM1 1h2v1H1zM5 1h2v1H5zM1 2h2v1H1zM5 2h2v1H5zM0 3h8v1H0zM0 4h8v1H0zM0 5h3v1H0zM5 5h3v1H5zM0 6h3v1H0zM5 6h3v1H5zM0 7h8v1H0z"/></svg>
        </div>
      </div>

      <div style="margin-top:14px">
        <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;letter-spacing:1px;color:#8e9ad0">EMAIL</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;box-sizing:border-box;margin-top:6px;padding:0 14px;background:#0d1236;box-shadow:inset 3px 3px 0 0 #060920,inset -3px -3px 0 0 #1c2766">
          <span style="font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:17px;color:#ffffff">name@gmail.com</span>
          <svg role="img" aria-label="Locked" width="16" height="16" viewBox="0 0 8 8" shape-rendering="crispEdges" style="flex:none;display:block"><path fill="#a4aed9" d="M2 0h4v1H2zM1 1h2v1H1zM5 1h2v1H5zM1 2h2v1H1zM5 2h2v1H5zM0 3h8v1H0zM0 4h8v1H0zM0 5h3v1H0zM5 5h3v1H5zM0 6h3v1H0zM5 6h3v1H5zM0 7h8v1H0z"/></svg>
        </div>
      </div>

      <p style="margin:14px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:14px;line-height:1.5;color:#a4aed9">These details are locked and can't be edited. You can manage or delete your account from your profile.</p>

      <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px">
        <a class="btn notch" href="#profile" style="display:flex;align-items:center;justify-content:center;height:48px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-weight:700;font-size:14px;letter-spacing:1px;text-decoration:none;color:#ffffff;background:#243372;box-shadow:inset -4px -4px 0 0 #172052,inset 4px 4px 0 0 #3a4a94">VIEW PROFILE</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":600}}'>
class Component extends DCLogic {
  state = { open: true };
  renderVals() {
    return {
      open: this.state.open,
      toggle: () => this.setState({ open: !this.state.open }),
    };
  }
}
</script>
</body>
</html>
