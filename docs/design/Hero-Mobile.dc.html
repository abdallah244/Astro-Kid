<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
.notch{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
a.btn:hover,button.btn:hover{filter:brightness(1.12)}
a.btn:active,button.btn:active{transform:translateY(3px)}
a:focus-visible,button:focus-visible{outline:4px solid #ffd23f;outline-offset:4px}
.astro1{width:125px;height:169px;background:url(/assets/sprites/astro_idle.png) 0 0/250px 169px no-repeat;image-rendering:pixelated;animation:astroIdle1 1.2s linear infinite}
@keyframes astroIdle1{0%,49.99%{background-position:0 0}50%,100%{background-position:-125px 0}}
.astro2{width:250px;height:338px;background:url(/assets/sprites/astro_idle.png) 0 0/500px 338px no-repeat;image-rendering:pixelated;animation:astroIdle2 1.2s linear infinite}
@keyframes astroIdle2{0%,49.99%{background-position:0 0}50%,100%{background-position:-250px 0}}
@media (prefers-reduced-motion:reduce){.astro2{animation:none}}
</style>
</helmet>
<div style="position:relative;width:390px;height:1060px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <header style="position:absolute;left:0;top:0;width:390px;z-index:5;height:72px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#060920;border-bottom:4px solid #3a4a94;box-shadow:0 4px 0 0 #172052">
    <a href="#top" aria-label="Astro Kid, home" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <img src="/favicon-48.png" alt="" width="40" height="40" style="width:40px;height:40px;image-rendering:pixelated;display:block">
      <span style="font-family:'Press Start 2P',monospace;font-size:14px;line-height:1;color:#ffffff;text-shadow:2px 2px 0 #243372;white-space:nowrap">ASTRO <span style="color:#ffd23f;text-shadow:2px 2px 0 #c2410c">KID</span></span>
    </a>
    <button class="btn notch" type="button" aria-label="Menu" aria-expanded="false" style="width:48px;height:48px;padding:0;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#243372;box-shadow:inset -4px -4px 0 0 #172052,inset 4px 4px 0 0 #3a4a94">
      <div aria-hidden="true" style="display:flex;flex-direction:column;gap:4px">
        <div style="width:20px;height:4px;background:#eef1ff"></div>
        <div style="width:20px;height:4px;background:#eef1ff"></div>
        <div style="width:20px;height:4px;background:#eef1ff"></div>
      </div>
    </button>
  </header>

  <section aria-labelledby="hero-title-m" style="position:absolute;left:0;top:76px;width:390px;height:984px;overflow:hidden">
    <img src="/assets/backgrounds/lunar_base_expanded.png" alt="" width="390" height="984" style="position:absolute;left:0;top:0;width:390px;height:984px;object-fit:cover;object-position:88% bottom;image-rendering:pixelated">
    <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(6,9,32,0.64)"></div>
    <div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:390px;height:96px">
      <div style="position:absolute;left:0;top:0;width:390px;height:16px;background:rgba(6,9,32,0.2)"></div>
      <div style="position:absolute;left:0;top:16px;width:390px;height:16px;background:rgba(6,9,32,0.4)"></div>
      <div style="position:absolute;left:0;top:32px;width:390px;height:16px;background:rgba(6,9,32,0.6)"></div>
      <div style="position:absolute;left:0;top:48px;width:390px;height:16px;background:rgba(6,9,32,0.8)"></div>
      <div style="position:absolute;left:0;top:64px;width:390px;height:32px;background:#060920"></div>
    </div>

    <div style="position:absolute;left:20px;top:28px;width:350px;display:flex;flex-direction:column;align-items:flex-start">

      <div class="notch" style="display:inline-flex;align-items:center;gap:8px;height:36px;box-sizing:border-box;padding:0 14px;background:#141c4d;box-shadow:inset -4px -4px 0 0 #0d1236,inset 4px 4px 0 0 #3a4a94;font-family:'Silkscreen',monospace;font-weight:700;font-size:11px;letter-spacing:1px;color:#ffd23f">
        <span aria-hidden="true" style="width:8px;height:8px;background:#ffd23f"></span>
        LEARN SPACE SCIENCE BY PLAYING
      </div>

      <h1 id="hero-title-m" style="margin:22px 0 0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:52px;line-height:1.18;color:#ffffff;text-shadow:3px 3px 0 #243372,6px 6px 0 #172052">ASTRO<br><span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c,6px 6px 0 #7a2a0a">KID</span></h1>

      <p style="margin:24px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:17px;line-height:1.55;color:#e4e8ff;text-shadow:0 2px 0 #060920">Survive on the Moon. Manage oxygen, power and time. Learn the real trade-offs behind every space mission, without opening a textbook.</p>

      <div style="width:350px;display:flex;flex-direction:column;gap:16px;margin-top:26px">
        <a class="btn notch" href="#demo" style="display:flex;align-items:center;justify-content:center;gap:12px;height:56px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:1px;text-decoration:none;color:#0d2a14;background:#3fbf5f;box-shadow:inset -4px -4px 0 0 #1d7a36,inset 4px 4px 0 0 #8be8a2">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" style="display:block"><path fill="#0d2a14" d="M0 0h2v6H0zM2 1h2v4H2zM4 2h2v2H4z"/></svg>
          PLAY FREE DEMO
        </a>
        <a class="btn notch" href="#get" style="display:flex;align-items:center;justify-content:center;height:56px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:1px;text-decoration:none;color:#1a1a2e;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0">GET THE GAME</a>
      </div>

      <ul style="list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;font-family:'Silkscreen',monospace;font-size:12px;letter-spacing:1px;color:#c9d0f5;text-shadow:0 2px 0 #060920">
        <li style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:8px;height:8px;background:#3fbf5f"></span>AGES 7-12</li>
        <li style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:8px;height:8px;background:#3fbf5f"></span>RUNS IN BROWSER</li>
        <li style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:8px;height:8px;background:#3fbf5f"></span>NO SIGN-UP</li>
      </ul>

      <!-- astronaut -->
      <div style="position:relative;width:350px;height:338px;margin-top:12px">
        <div aria-hidden="true" style="position:absolute;left:90px;top:316px;width:170px;height:6px;background:rgba(0,0,0,0.35)"></div>
        <div aria-hidden="true" style="position:absolute;left:110px;top:322px;width:130px;height:6px;background:rgba(0,0,0,0.35)"></div>
        <div class="astro2" role="img" aria-label="Astro Kid, the young astronaut" style="position:absolute;left:50px;top:0"></div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
