<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navbar Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
a.navlink{color:#a4aed9}
a.navlink:hover{color:#ffd23f}
a.btn:hover{filter:brightness(1.12)}
a.btn:active{transform:translateY(3px)}
a:focus-visible{outline:4px solid #ffd23f;outline-offset:4px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:220px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <!-- pixel stars: sample of the page background under the sticky bar -->
  <div aria-hidden="true" style="position:absolute;inset:0">
    <div style="position:absolute;left:96px;top:128px;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:212px;top:176px;width:8px;height:8px;background:#a4aed9"></div>
    <div style="position:absolute;left:388px;top:140px;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:520px;top:192px;width:4px;height:4px;background:#ffd23f"></div>
    <div style="position:absolute;left:664px;top:132px;width:8px;height:8px;background:#ffffff"></div>
    <div style="position:absolute;left:756px;top:180px;width:4px;height:4px;background:#a4aed9"></div>
    <div style="position:absolute;left:892px;top:144px;width:4px;height:4px;background:#ffffff"></div>
    <div style="position:absolute;left:1004px;top:196px;width:8px;height:8px;background:#a4aed9"></div>
    <div style="position:absolute;left:1120px;top:136px;width:4px;height:4px;background:#ffd23f"></div>
    <div style="position:absolute;left:1204px;top:172px;width:4px;height:4px;background:#ffffff"></div>
  </div>

  <header style="position:relative;z-index:2;height:88px;box-sizing:border-box;background:#060920;border-bottom:4px solid #3a4a94;box-shadow:0 4px 0 0 #172052;display:flex;align-items:center;justify-content:center">
    <div style="width:1120px;display:flex;align-items:center;justify-content:space-between;gap:24px">

      <a href="#top" aria-label="Astro Kid, home" style="display:flex;align-items:center;gap:16px;text-decoration:none">
        <img src="/favicon-48.png" alt="" width="48" height="48" style="width:48px;height:48px;image-rendering:pixelated;display:block">
        <span style="font-family:'Press Start 2P',monospace;font-size:18px;line-height:1;color:#ffffff;text-shadow:3px 3px 0 #243372;white-space:nowrap">ASTRO <span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c">KID</span></span>
      </a>

      <nav aria-label="Primary" style="display:flex;align-items:center;gap:36px">
        <a class="navlink" href="#learn" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;padding:12px 0">LEARN</a>
        <a class="navlink" href="#missions" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;padding:12px 0">MISSIONS</a>
        <a class="navlink" href="#install" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;padding:12px 0">INSTALL</a>

        <span aria-hidden="true" style="width:4px;height:32px;background:#243372"></span>

        <!-- free demo: green -->
        <a class="btn" href="#demo" style="display:inline-flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;padding:0 22px;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;color:#0d2a14;background:#3fbf5f;box-shadow:inset -4px -4px 0 0 #1d7a36,inset 4px 4px 0 0 #8be8a2;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" style="display:block"><path fill="#0d2a14" d="M0 0h2v6H0zM2 1h2v4H2zM4 2h2v2H4z"/></svg>
          PLAY DEMO
        </a>

        <!-- email gate: yellow -->
        <a class="btn" href="#get" style="display:inline-flex;align-items:center;height:48px;box-sizing:border-box;padding:0 22px;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none;color:#1a1a2e;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0;clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))">GET THE GAME</a>
      </nav>

    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":220}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
