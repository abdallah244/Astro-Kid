<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading Components</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#060920}
.notch{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.sq{width:20px;height:20px;background:#243372;animation:sq 0.96s linear infinite}
@keyframes sq{0%,12.49%{background:#ffd23f}12.5%,24.99%{background:#f5a524}25%,100%{background:#243372}}
.dot{width:6px;height:6px;background:#1a1a2e;animation:dot 1.2s linear infinite}
@keyframes dot{0%,24.99%{opacity:0.25}25%,100%{opacity:1}}
.ind{width:64px;height:100%;background:#ffd23f;box-shadow:inset -3px -3px 0 0 #f5a524,inset 3px 3px 0 0 #fff3b0;animation:ind 1.2s steps(14) infinite}
@keyframes ind{from{transform:translateX(-64px)}to{transform:translateX(224px)}}
.sk{background:#1c2766;animation:sk 1.2s steps(1) infinite}
@keyframes sk{0%,49.99%{background:#1c2766}50%,100%{background:#2c3b86}}
@media (prefers-reduced-motion:reduce){.sq,.dot,.ind,.sk{animation:none}}
</style>
</helmet>
<div style="position:relative;width:1280px;height:480px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <div style="position:absolute;left:60px;top:44px;font-family:'Press Start 2P',monospace;font-size:20px;line-height:1.4;color:#ffffff;text-shadow:3px 3px 0 #243372">LOADING <span style="color:#ffd23f;text-shadow:3px 3px 0 #c2410c">STATES</span></div>

  <div style="position:absolute;left:60px;top:120px;width:1160px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px">

    <!-- 1 spinner -->
    <section aria-label="Pixel spinner" style="box-sizing:border-box;height:300px;padding:24px;background:#141c4d;box-shadow:0 -4px 0 0 #3a4a94,0 4px 0 0 #3a4a94,-4px 0 0 0 #3a4a94,4px 0 0 0 #3a4a94,10px 10px 0 0 rgba(0,0,0,0.5)">
      <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#ffd23f">SPINNER</div>
      <div role="img" aria-label="Loading" style="display:grid;grid-template-columns:repeat(3,20px);gap:6px;justify-content:center;margin-top:48px">
        <div class="sq" style="animation-delay:0s"></div>
        <div class="sq" style="animation-delay:0.12s"></div>
        <div class="sq" style="animation-delay:0.24s"></div>
        <div class="sq" style="animation-delay:0.84s"></div>
        <div></div>
        <div class="sq" style="animation-delay:0.36s"></div>
        <div class="sq" style="animation-delay:0.72s"></div>
        <div class="sq" style="animation-delay:0.6s"></div>
        <div class="sq" style="animation-delay:0.48s"></div>
      </div>
      <p style="margin:48px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:15px;line-height:1.5;color:#a4aed9;text-align:center">Short waits, page transitions</p>
    </section>

    <!-- 2 button loading -->
    <section aria-label="Button loading state" style="box-sizing:border-box;height:300px;padding:24px;background:#141c4d;box-shadow:0 -4px 0 0 #3a4a94,0 4px 0 0 #3a4a94,-4px 0 0 0 #3a4a94,4px 0 0 0 #3a4a94,10px 10px 0 0 rgba(0,0,0,0.5)">
      <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#ffd23f">BUTTON</div>
      <div class="notch" aria-busy="true" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;margin-top:52px;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:1px;color:#1a1a2e;cursor:progress">
        SIGNING IN
        <span aria-hidden="true" style="display:flex;gap:4px;align-items:flex-end;height:14px">
          <span class="dot" style="animation-delay:0s"></span>
          <span class="dot" style="animation-delay:0.3s"></span>
          <span class="dot" style="animation-delay:0.6s"></span>
        </span>
      </div>
      <p style="margin:48px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:15px;line-height:1.5;color:#a4aed9;text-align:center">While a request is running</p>
    </section>

    <!-- 3 indeterminate bar -->
    <section aria-label="Indeterminate progress" style="box-sizing:border-box;height:300px;padding:24px;background:#141c4d;box-shadow:0 -4px 0 0 #3a4a94,0 4px 0 0 #3a4a94,-4px 0 0 0 #3a4a94,4px 0 0 0 #3a4a94,10px 10px 0 0 rgba(0,0,0,0.5)">
      <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#ffd23f">PROGRESS</div>
      <div role="progressbar" aria-label="Loading" style="box-sizing:border-box;height:32px;margin-top:62px;padding:4px;overflow:hidden;background:#0d1236;box-shadow:0 0 0 4px #3a4a94">
        <div style="position:relative;height:100%;overflow:hidden"><div class="ind"></div></div>
      </div>
      <p style="margin:60px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:15px;line-height:1.5;color:#a4aed9;text-align:center">When the length is unknown</p>
    </section>

    <!-- 4 skeleton -->
    <section aria-label="Skeleton placeholder" style="box-sizing:border-box;height:300px;padding:24px;background:#141c4d;box-shadow:0 -4px 0 0 #3a4a94,0 4px 0 0 #3a4a94,-4px 0 0 0 #3a4a94,4px 0 0 0 #3a4a94,10px 10px 0 0 rgba(0,0,0,0.5)">
      <div style="font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#ffd23f">SKELETON</div>
      <div aria-hidden="true" style="display:flex;gap:14px;align-items:center;margin-top:40px">
        <div class="sk" style="flex:none;width:56px;height:56px"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:10px">
          <div class="sk" style="height:14px;width:90%"></div>
          <div class="sk" style="height:14px;width:60%"></div>
        </div>
      </div>
      <div aria-hidden="true" style="display:flex;flex-direction:column;gap:10px;margin-top:22px">
        <div class="sk" style="height:12px"></div>
        <div class="sk" style="height:12px;width:80%"></div>
      </div>
      <p style="margin:34px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:15px;line-height:1.5;color:#a4aed9;text-align:center">While content is fetched</p>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
