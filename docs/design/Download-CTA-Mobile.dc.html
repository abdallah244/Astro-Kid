<style>

a.lnk{color:#a4aed9}

</helmet>
<div style="position:relative;width:390px;height:700px;overflow:hidden;background:#060920;font-family:'Silkscreen',monospace">

  <div aria-hidden="true" style="position:absolute;inset:0">

  <section id="get" aria-labelledby="cta-title-m" style="position:absolute;left:20px;top:312px;width:350px;display:flex;flex-direction:column;align-items:center;text-align:center">

    <div class="notch" style="display:inline-flex;align-items:center;gap:10px;height:32px;box-sizing:border-box;padding:0 14px;background:#141c4d;box-shadow:inset -4px -4px 0 0 #0d1236,inset 4px 4px 0 0 #3a4a94;font-family:'Silkscreen',monospace;font-weight:700;font-size:12px;letter-spacing:2px;color:#3fbf5f">

    <h2 id="cta-title-m" style="margin:16px 0 0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:18px;line-height:1.5;color:#ffffff;text-shadow:2px 2px 0 #243372">READY TO LAND<br><span style="color:#ffd23f;text-shadow:2px 2px 0 #c2410c">ON THE MOON?</span></h2>

    <p style="margin:16px 0 0;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:16px;line-height:1.6;color:#c9d0f5">Play the free demo in your browser, or get the full game for your desktop.</p>

    <div style="position:relative;display:block;width:350px;margin-top:28px">
      <div aria-hidden="true" class="notch" style="position:absolute;left:5px;top:5px;width:100%;height:100%;background:rgba(0,0,0,0.5)"></div>
      <a class="btn notch" href="#download-page" style="position:relative;display:flex;align-items:center;justify-content:center;gap:14px;width:350px;height:64px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-weight:700;font-size:19px;letter-spacing:1px;text-decoration:none;color:#1a1a2e;background:#ffd23f;box-shadow:inset -4px -4px 0 0 #f5a524,inset 4px 4px 0 0 #fff3b0">GET THE GAME <svg aria-hidden="true" width="16" height="16" viewBox="0 0 7 7" shape-rendering="crispEdges" style="display:block"><path fill="#1a1a2e" d="M0 3h5v1H0zM4 2h1v3H4zM5 1h1v5H5zM6 2h1v3H6z"/></svg></a>
    </div>

    <a class="lnk" href="#demo" style="display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:10px 0;font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:1px;text-decoration:none">
      <span aria-hidden="true" style="width:8px;height:8px;background:#3fbf5f"></span>OR PLAY THE FREE DEMO
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":700}}'>

</html>
